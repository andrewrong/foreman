name: test

on:
  push:
    branches: [main, dev/v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted runner: the repository is public, so standard runners cost nothing and no
    # outside code runs on the owner's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "not gofmt-clean:"; echo "$files"; exit 1; fi
      - run: go vet ./...
      - name: go test
        run: |
          set -o pipefail
          # Temporary files and test databases on the RAM-backed /dev/shm, where fsync costs nothing;
          # the go command's build files stay on disk.
          export TMPDIR=/dev/shm/foreman-test && mkdir -p "$TMPDIR"
          export GOTMPDIR="$RUNNER_TEMP"
          go test -v -race -timeout 15m ./... | tee "$RUNNER_TEMP/go-test.log"
      - name: failures as annotations
        # Annotations are readable through the public API without a token, so a failure's cause
        # can be read without opening the run page.
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/go-test.log" ] || exit 0
          grep -nE -A8 '^[[:space:]]*--- FAIL|^panic:|^FAIL[[:space:]]|test timed out' "$RUNNER_TEMP/go-test.log" \
            | head -150 | awk 'BEGIN{ORS="%0A"} {print}' | fold -w 4000 | head -9 \
            | while IFS= read -r chunk; do echo "::error title=go test failure::$chunk"; done
      - name: slowest tests
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/go-test.log" ] || exit 0
          { echo "### 20 slowest tests"; grep -E '^--- (PASS|FAIL)' "$RUNNER_TEMP/go-test.log" \
              | sed -E 's/^--- (PASS|FAIL): ([^ ]+) \(([0-9.]+)s\)/\3 \2 \1/' | sort -rn | head -20; } >> "$GITHUB_STEP_SUMMARY"
