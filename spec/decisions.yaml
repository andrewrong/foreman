    statement: "配置默认值只有一个来源：design/config.yaml 的 keys 表（键、文件、类型、默认值、出处）。代码中的默认值由 internal/config/schema/configgen 生成，不得手写；schema 中每个键必须在表中，表中每个键必须在 schema 中。spec 不给数值的键写 default: owner，owner 未设置时 foremand 拒绝启动，实现不得自行补值。起因：实现时 spec 未集中列出默认值，子代理补了与 D-054 冲突的 pr_split_lines=400、与 D-042 冲突的 steps_per_requirement=3。取代 config.yaml CD-05 中『default 值在代码里』"
    enforced_by: "test:config-defaults-generated；test:config-keys-match-schema；test:config-owner-keys-required"
    status: active

  - id: D-075
    date: 2026-11-28
    statement: "（取代 D-069，恢复 D-032 的做法，owner 2026-11-28 确认）internal/forge 的 REST 用 github.com/google/go-github（go.mod 固定一个大版本，升级走 PR），FG-8 的 GraphQL 批量查询用 github.com/shurcooL/githubv4；自写部分只有 ETag 条件请求 RoundTripper（LIB-3）、Gate 包装（LIB-4）与错误映射。起因：T9 任务简报写了『优先 net/http』，与 forge.yaml LIB-1 冲突；实现按简报手写了协议层，审查时没有对照 forge.yaml，反而写 D-069 让 spec 迁就代码"
    supersedes: D-069
    enforced_by: "test:module-deps；test:forge-error-mapping；test:forge-live-smoke"
    status: active

  - id: D-076
    date: 2026-11-28
    statement: "（owner 2026-11-28 要求，与 agent-crew 一致）先找现成库：优先用多人维护的现成代码，出问题时恢复方便；只有没有合适的库、或合适的库性价比低、不稳定时才自写。自写或换库须写 decision，列出评估过的候选库（名称、维护情况、不选的理由）。所有外部依赖登记在 design/modules.yaml deps（模块、用途、出处）；check:deps-registry 比对 go.mod 直接依赖与 import：未登记的依赖、登记为 required 却未被导入的库都失败。补登记三个此前由实现自行选定、spec 未记录的依赖：gopkg.in/yaml.v3、modernc.org/sqlite（D-004 只定了 sqlite，未定驱动；选纯 Go 驱动以免 cgo）、github.com/BurntSushi/toml；三者都是多人维护的主流库，符合本条，owner 确认后保留"
    enforced_by: "check:deps-registry；check:spec-lint"
    status: active

  - id: D-077
    date: 2026-11-28
    statement: "（owner 2026-11-28）选库不需要 owner 审批，按以下标准自查后直接登记：满足其一即为主流库：① 近 12 个月有发版或提交，且被广泛使用（star 或 pkg.go.dev 导入数在千级以上）；② 由大厂或知名组织维护且被广泛使用，即使近期不更新。另须许可证兼容（MIT、BSD、Apache 2.0、MPL 2.0）；原库停止维护而有维护中的继任者时用继任者。登记时在 deps 写 evidence（维护方、最近发版、使用规模）。据此把 gopkg.in/yaml.v3（2022 年后无发版）换为继任者 go.yaml.in/yaml/v3，并取消 D-076 中『owner 确认后保留』"
    amends: D-076
    enforced_by: "check:deps-registry"
    status: active

  - id: D-078
    date: 2026-11-28
    statement: "（owner 2026-11-28）解耦与组合由程序检查，不靠模型审查：modules.yaml 为每个模块声明 uses 白名单（MD-10），stage、role 兄弟 package 互不导入（MD-11），只有 cli 组装、其他 package 导入本仓库 package ≤ 8 个（MD-12），禁止可变全局变量（MD-13）、函数认知复杂度 ≤ 30（MD-14）。MD-10..MD-12 在 test:module-deps 中检查；MD-13、MD-14 用 golangci-lint（go.mod tool 指令固定版本，go tool golangci-lint run）。不设历史例外：现有违反（pipeline 依赖 forge、harness、sandbox、stage、workspace；sched 导入 21 个 package；stage 兄弟导入 3 处）在接入检查的同一任务中改掉：pipeline 通过自身定义的接口调度阶段，具体阶段由 cli 注入。模型只在修改架构声明时参与"
    enforced_by: "test:module-deps；check:golangci-lint"
    status: active

  - id: D-079
    date: 2026-11-28
    statement: "（补充 D-077）D-077 的许可证要求只针对被导入、随 foreman 分发的库；只在开发时运行、不被导入也不分发的工具（go.mod tool 指令，如 golangci-lint，GPL 3.0 许可证）不受许可证白名单限制，仍须满足主流标准并在 deps 中以 kind: tool 登记。另记：cmd/foreman 的场景测试约 115s，超出 C-06 的单 package 30s，属既有问题，待拆分或改为并行"
    enforced_by: "check:deps-registry"
    status: active

  - id: D-080
    date: 2026-11-28
    statement: "（owner 2026-11-28 要求检查主目录配置是否可读；探测见 docs/probes/phase-1.md P5）沙箱读权限改为白名单：srt 设置的 denyRead 包含 owner 主目录整体与 FOREMAN_HOME 所在数据卷的根（以及其他配置的数据根），allowRead 只列出本次运行需要读的路径：会话仓库、运行目录、harness 安装目录、工具链目录（Go、node、git 等，由配置给出）、项目缓存副本。原来只禁读 ~/.ssh 等少数目录的做法下，~/.claude（含全部会话记录）、shell 历史、~/.docker、~/.npmrc、钥匙串文件、其他项目与 Gemini 评审目录都可读。写权限不变。由带开关的真实沙箱测试（test:sandbox-read-allowlist，在 srt 内用 shell 逐项读取，不经模型）保证"
    enforced_by: "test:sandbox-read-allowlist"
    status: active

  - id: D-081
    date: 2026-11-28
    statement: "（P5 补充检查后补全 D-080）① allowRead 必须包含镜像 repo.git（只读，会话仓库的对象在其中，与 access.yaml R0 一致）；② 策略中的每个路径（allowRead、denyRead、allowWrite、PATH 的每一项）在生成时用 realpath 解析，启动前自检每一项存在；③ allowRead 的工具链等条目进 config.yaml keys 表，默认 owner，不由实现推断；④ 会话环境设 GIT_CONFIG_GLOBAL=/dev/null、GIT_CONFIG_NOSYSTEM=1；⑤ 被沙箱拒绝的访问要留下记录（srt 的违规上报或系统沙箱日志）写入运行目录，避免只看到一句 EPERM 而查不出原因"
    amends: D-080
    enforced_by: "test:sandbox-read-allowlist"
    status: active
