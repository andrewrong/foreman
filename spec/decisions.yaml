# foreman 决定记录。唯一事实来源：方案文档由本文件 + constitution.yaml + design/*.yaml 渲染生成。
# 规则：只追加。链接字段只有三种，都写在新条目上：supersedes（旧条目整体作废，其 status 改为 superseded）、
#       amends（旧条目仍有效，与新条目合读）、resolves（解决的 open question id）。status: active | superseded。
# 每条必须有 enforced_by（test:<名> | check:<名> | sandbox | program:<模块> | none）。
schema: foreman.decisions/1

decisions:
  - id: D-001
    date: 2026-11-27
    statement: "实现语言为 Go"
    enforced_by: none
    status: active

  - id: D-002
    date: 2026-11-27
    statement: "流水线由程序驱动；AI 只产出结构化结果文件，程序校验后推进状态；不设常驻 AI 协调窗口"
    rationale: "agent-crew 14 天内 dispatcher+advisor 窗口占花费约 57%，worker 占 14%（口径未核实）"
    enforced_by: program:pipeline
    status: active

  - id: D-003
    date: 2026-11-27
    statement: "需求实体为单一类型 Requirement，kind ∈ {feature, bug, chore}；内容分三层：spec（版本化）、discoveries（只追加）、derived（程序由真实 diff 计算）"
    enforced_by: program:spec
    status: active

  - id: D-004
    date: 2026-11-27
    statement: "权威记录为 sqlite：~/.foreman/global.db、~/.foreman/projects/<p>/work.db、~/.foreman/projects/<p>/ci.db；只有 foremand 写"
    enforced_by: program:store
    status: active

  - id: D-005
    date: 2026-11-27
    statement: "兜底顺序：同 stage 重试 3 次 → 救援 stage（Opus + advisor）→ 救援失败 2 次 → 人工收件箱。人工只处理 H1–H6"
    params:
      H1: "需求意图歧义，属于产品决策"
      H2: "需要凭据或密钥，或修改外部账号配置"
      H3: "不可逆操作：生产数据迁移、删数据、改公开 API"
      H4: "单需求 token 累计超过预算 2 倍"
      H5: "救援 stage 连续失败 2 次"
      H6: "任何权限扩大：沙箱新增放行、提高 token 上限、角色新增工具或能力、修改 H1–H6、修改隐私扫描配置"
    enforced_by: program:pipeline
    status: superseded

  - id: D-006
    date: 2026-11-27
    statement: "工作单位是需求：一个需求 = 一个分支 + 一个主 worktree；需求内拆成多个有依赖的步骤；默认一个需求一个 PR，结束时 diff > 800 行则按步骤切成多个顺序合并的 PR"
    enforced_by: program:pipeline
    status: superseded

  - id: D-007
    date: 2026-11-27
    statement: "检查分三层：L0 本地沙箱（build+vet+gofmt+改动 package 的 -short 单测，≤120s，GOMAXPROCS=2，2GB）；L1 PR 上的 GitHub CI（lint+build+全部单测，≤5min）；L2 nightly GitHub CI（集成、-race、scripted-harness 端到端，≤60min）"
    enforced_by: program:stage/check
    status: superseded

  - id: D-008
    date: 2026-11-27
    statement: "nightly 失败：失败测试重跑 3 次判定 flaky；真失败用 git bisect run 定位 commit，程序自动创建 bug 需求进入同一流水线"
    enforced_by: program:ci
    status: active

  - id: D-009
    date: 2026-11-27
    statement: "沙箱内放开（bypass 模式，无命令白名单/分类器/deny 规则），沙箱外锁死（无凭据、不能 push/merge、main 分支保护）"
    enforced_by: sandbox
    status: superseded

  - id: D-010
    date: 2026-11-27
    statement: "foreman 管理自己（dogfooding）。每个需求合并后程序生成结构化反馈报告；改进 stage 每 10 个合并需求或 24h 内 3 个 abnormal 时运行，每周最多 3 个改进需求；改进合并后再跑 10 个需求对比指标，未达标自动生成回退需求；改护栏触发 H6"
    enforced_by: program:improve
    status: superseded

  - id: D-011
    date: 2026-11-27
    statement: "部署：单个常驻进程 foremand，在进程内推进；重启可恢复；前期不做开机自启；keeper 后期从 agent-crew 迁移"
    enforced_by: program:daemon
    status: active

  - id: D-012
    date: 2026-11-27
    statement: "反馈与提问的通道：Telegram + web 收件箱。提问格式唯一：一个 id、2–3 个按钮、一个推荐，必须有'做什么/改变什么/检查了什么'字段；点按即回答"
    enforced_by: program:notify
    status: active

  - id: D-013
    date: 2026-11-27
    statement: "web 复用 agent-crew 的栈（React + Vite + Tailwind + shadcn），构建产物不提交；手机优先；第一版 3 个页面：现在、等我处理、需求详情；web 层拿不到 GitHub 客户端"
    enforced_by: test:web-no-github-import
    status: active

  - id: D-014
    date: 2026-11-27
    statement: "隐私做成可复用工具 privguard，所有项目共用；规则 P1–P7 为默认策略，项目可追加模式"
    enforced_by: check:privguard
    status: active

  - id: D-015
    date: 2026-11-27
    statement: "设计与规格文档用可校验的结构化格式（YAML + EARS），方案文档由数据渲染，禁用模糊词"
    enforced_by: check:spec-lint
    status: active

  - id: D-016
    date: 2026-11-27
    statement: "需求内无依赖的步骤可并行：并行步骤各用一个从需求分支派生的临时 worktree，完成后由程序合回需求分支；单需求并行度默认 2"
    enforced_by: program:pipeline
    status: superseded

  - id: D-017
    date: 2026-11-27
    statement: "开发资源分级 R0–R3（见 design/access.yaml）；被拒的访问变成结构化 access_request，R1 自动授予，R2 由 owner 一次批准后写入项目声明永久生效，R3 永不进入沙箱"
    enforced_by: program:sandbox
    status: active

  - id: D-018
    date: 2026-11-27
    statement: "privguard 放在独立仓库；foreman 接入项目时自动安装"
    resolves: Q-001
    enforced_by: check:privguard
    status: active

  - id: D-019
    date: 2026-11-27
    statement: "skills 按角色分配（intake, planner, coder, reviewer, rescuer, diagnoser, improver），见 design/skills.yaml；每次运行只注入该角色的 skills"
    resolves: Q-002
    enforced_by: program:harness
    status: superseded

  - id: D-020
    date: 2026-11-27
    statement: "语言 profile 首批 Go、TypeScript；之后 Python、Rust。profile = 工具配置（L0/L1 强制）+ ≤1.5k token 短规则 + 生成的 review 清单；按步骤改动的文件扩展名注入"
    resolves: Q-003
    enforced_by: program:context
    status: active

  - id: D-021
    date: 2026-11-27
    statement: "线上访问：AI 不拿线上凭据、无线上 shell；只读诊断工具由 foremand 代执行（限额、脱敏、审计）；可逆动作（回滚、重启）限频自动执行；不可逆动作走 H3。见 design/prod-access.yaml"
    enforced_by: program:prodbroker
    status: active

  - id: D-022
    date: 2026-11-27
    statement: "配置与代码分离：配置在 ~/.foreman/config/，owner 用 foreman config 或 web 设置页直接改，schema 校验 + revision + 一键回退，不走 PR；AI 改配置只能发配置提议按钮（H6）。代码与提示词走 PR。清单见 design/config.yaml"
    enforced_by: program:config
    status: active

  - id: D-023
    date: 2026-11-27
    statement: "diagnoser 继承 agent-crew diagnose 的预采集包、not_collected 标记、只读、原始材料不外发；改为检出线上实际 commit、可按需再取数据、产出本地失败测试、发布由程序经 privguard 完成。见 design/prod-access.yaml"
    enforced_by: program:prodbroker
    status: active

  - id: D-024
    date: 2026-11-27
    statement: "模块与 package 分开：模块是功能单元，可以大，由多个 package 组成（如 pipeline = state + queue + lease + escalate）；package 受 C-03 上限约束。依赖方向在模块级和 package 级都检查"
    enforced_by: check:size-limits
    status: active

  - id: D-025
    date: 2026-11-27
    statement: "设计方案与协议的交付流程：1) 协议必须写全字段（名称、类型、必填/可选、取值范围、默认值）、错误情况、版本号与兼容规则；2) 每个协议附至少 2 个示例（正常 + 出错），示例必须通过 schema 校验；3) 交付前通过 spec lint，并由一个未参与编写的独立会话（advisor）审查；4) 审查发现的问题修完才交付"
    enforced_by: check:spec-lint
    status: active

  - id: D-026
    date: 2026-11-27
    statement: "密钥复用现有服务部署约定：目录由 foreman 配置项 secrets_dir 指定（默认值取 agent-crew services.toml 的 secrets 目录），目录 0700，文件名 foreman.<名称>（0600）；foreman 读自己的密钥前检查普通文件、perm&0o077==0、非符号链接，token 类文件另要求长度≥32，错误文本不含值；业务服务的 env 文件 foreman 不打开，只传目录；一个密钥只有一份来源，备份不放在该目录；所有 AI 沙箱对该目录 deny 并有探针证明。取代 design/config.yaml 中 ~/.foreman/secrets/ 的写法"
    amends: D-022
    enforced_by: test:secret-file-check
    status: active

  - id: D-027
    date: 2026-11-27
    statement: "资源层 internal/resource：模型 token、GitHub REST/GraphQL/写操作/Actions 分钟、本地 CPU、会话数、磁盘统一预留-结算；预留失败任务进 waiting(quota)，不扣重试；按优先级 P0–P3 派发。见 design/resources.yaml"
    enforced_by: test:module-deps
    status: active

  - id: D-028
    date: 2026-11-27
    statement: "方案交付前的外部审查：1) 与 agent-crew dispatcher 逐条讨论；2) 用 Gemini 做对抗审查（调用方式问 agent-crew dispatcher）；两轮的意见与处理结果记入 docs/reviews/"
    enforced_by: none
    status: active

  - id: D-029
    date: 2026-11-27
    statement: "模型额度窗口由各 harness 适配器声明：claude、codex 默认只有 7 天窗口，gemini 为 5 小时 + 7 天；7 天窗口按剩余天数平摊每日可用量，当日用完只派发 P0"
    amends: D-027
    enforced_by: test:quota-daily-pacing
    status: superseded

  - id: D-030
    date: 2026-11-27
    statement: "资源层抽象为 Meter（测量真实剩余）、Ledger（进程内预留，持久化可恢复）、Gate（唯一放行点，Demand → Lease | Wait）、History（逐小时归因）。借鉴 agent-crew 的资源行模型、floor/warn、调用方归因、额度错误等待；改掉其只轮询无预留、只在启动时检查、定义写两处。见 design/resources.yaml"
    amends: D-027
    enforced_by: test:module-deps
    status: active

  - id: D-031
    date: 2026-11-27
    statement: "GitHub 访问不用 gh CLI：foremand 用 Go HTTP 客户端直接调 REST；每个响应读限额头更新 Meter；GET 走 ETag 条件请求（304 不计数）；错误类型化；只暴露固定操作集合；按仓库批量轮询；GraphQL 仅在替代 ≥3 次 REST 时使用并按返回 cost 结算；push 走 git 协议。见 design/forge.yaml"
    enforced_by: check:no-gh-exec
    status: active

  - id: D-032
    date: 2026-11-27
    statement: "GitHub REST 用 github.com/google/go-github，GraphQL 用 github.com/shurcooL/githubv4；自写部分只有 ETag 缓存 RoundTripper 与 Gate 包装，internal/forge 自写代码约 600–900 行"
    amends: D-031
    enforced_by: none
    status: superseded

  - id: D-033
    date: 2026-11-27
    statement: "核心设计：状态机只在 Step 上（5 状态 × 4 阶段，integrate 步骤承担 PR/L1/最终 review/合并）；Run 不可变；Requirement 阶段由 Step 与 PR 推导；会话协议为 context.md + todo.json + result.json（原子写、run_id 幂等、独立进程组）。见 design/entities.yaml、state-machine.yaml、protocol-run.yaml、modules.yaml"
    enforced_by: test:state-table-exhaustive
    status: active

  - id: D-034
    date: 2026-11-27
    statement: "状态机改为结构化两表（Step 表 + Requirement hold 表），并由穷举脚本检查（覆盖、守卫穷尽、出口、计数上限）；事务只写数据库，外部动作由幂等 reconciler 执行；重新规划是需求级的单一 planner 运行；integrate 步骤由覆盖关系推导创建。改变了兜底阶梯（review 到上限也进入救援）、新增 squash 合回与 integrate 步骤"
    amends: [D-005, D-006, D-016, D-033]
    enforced_by: test:state-table-exhaustive
    status: active

  - id: D-035
    date: 2026-11-27
    statement: "新增兜底项 H7：同一步骤基础设施故障达到 dims.counters.infra 上限（6 次）后发 OwnerAsk，选项 [立即重试] [放弃该步骤]"
    amends: D-005
    resolves: Q-004
    enforced_by: test:state-table-exhaustive
    status: active

  - id: D-036
    date: 2026-11-27
    statement: "OwnerAsk 超过 deadline（72h）无回答：需求 hold=parked（state-machine H17），释放 worktree、保留分支，每 7 天提醒一次；owner 可随时恢复或放弃"
    resolves: Q-005
    enforced_by: test:state-table-exhaustive
    status: active

  - id: D-037
    date: 2026-11-27
    statement: "harness 保留统一接口，v1 只实现 claude 与 scripted 两个适配器；codex、gemini 适配器在有实际需要时另立决定再加；它们的额度窗口默认值保留在 D-029 但不实现"
    amends: D-029
    enforced_by: test:module-deps
    status: superseded

  - id: D-038
    date: 2026-11-27
    statement: "不依赖分支保护防止直接推 main（私有仓库在免费套餐下取不到保护，agent-crew 实测 403）：接入项目时调用 OP-12，403/404 记为 protection: unavailable 并在 web 与首次通知中告知 owner；无论保护是否可用，workspace 强制：所有 worktree 以 --no-track 创建、克隆中设 push.default=nothing、foremand 只用显式 refspec HEAD:refs/heads/foreman/<req id> 推送且目标不得是默认分支、推送后以 ls-remote 断言默认分支 sha 未变（变化则停止该项目所有推送并发 H6）。worktree 来自 foremand 自有的镜像 ~/.foreman/projects/<p>/repo.git，不触碰 owner 的工作检出（ACR-03、ACR-17）"
    amends: D-009
    enforced_by: "test:push-refspec-only；test:worktree-no-track；test:push-asserts-default-unchanged"
    status: superseded

  - id: D-039
    date: 2026-11-27
    statement: "H6 的触发由 spec/guardrails.yaml 的路径清单按 PR 真实 diff 判定；细粒度 PAT 不授予 workflows 权限，触及 .github/** 的 diff 在推送前拒绝并转 H6（ACR-04、ACR-22）"
    amends: D-005
    enforced_by: "test:guardrail-diff-needs-h6"
    status: superseded

  - id: D-040
    date: 2026-11-27
    statement: "默认模型：coder 用 Sonnet，reviewer 用 Opus（claude-opus-5-5）；写与审用不同模型以减少同源盲点。模型是配置（CF-02），owner 改配置不走 PR"
    enforced_by: test:config-role-model-defaults
    status: active

  - id: D-041
    date: 2026-11-27
    statement: "多 agent 编排：编排者只能是 foremand（程序），不设 AI 协调窗口；agent 之间不互发消息，只通过黑板（Discovery、Finding、步骤依赖图）间接交流；会话内 sub-agent 默认关闭，按角色在配置中开启。多视角 panel 阶段延后到 v1 之后依据数据决定（Q-006），现有 Run 模型（同一阶段可有多个不可变 Run）已为其留口"
    enforced_by: "test:module-deps；test:harness-subagent-default-off"
    status: active

  - id: D-042
    date: 2026-11-27
    statement: "v1 范围：核心闭环（intake → planner/快车道 → code → check → review → integrate → merge）+ 每次合并后的反馈报告 + Telegram 与 CLI 通知。web、improver、diagnoser 与线上访问、nightly 自动 bisect、需求内多步骤并行、超过 800 行拆多 PR 的设计保留在 spec 中，标 phase: v2，v1 不实现；v1 中需求内步骤串行执行、一个需求一个 PR"
    enforced_by: "check:spec-phase-tags"
    status: active

  - id: D-043
    date: 2026-11-27
    statement: "借鉴 Gemini Orchestrator（大模型规划/审查、小模型执行）：① 同一 stage 的第 3 次重试由 coder 默认模型升级为 Opus，仍失败才进入 rescuer；② coder 会话可配置 Opus advisor（CF-02，默认关闭），开启与否以 A/B 数据决定；③ 每次升级或 advisor 调用记录成本与是否改变结果。不接入 Antigravity 本身（D-037）"
    amends: D-005
    enforced_by: "test:retry-model-escalation"
    status: superseded

  - id: D-044
    date: 2026-11-27
    statement: "（取代 D-043 全文）借鉴 Gemini Orchestrator：① 同一 stage 的第 3 次重试由 coder 默认模型升级为 Opus，仍失败才进入 rescuer；② coder 会话默认配 Opus advisor（CF-02 可关）；③ 每次升级或 advisor 调用记录成本与是否改变结果，反馈报告按周汇总；若 30 个需求内 advisor 调用从未改变结果，在报告中提示关闭。不接入 Antigravity 本身（D-037）"
    supersedes: D-043
    enforced_by: "test:retry-model-escalation；test:config-role-model-defaults"
    status: active

  - id: D-045
    date: 2026-11-27
    statement: "沙箱与 git 隔离（GEM-1）：① 模型凭据是唯一进入会话的凭据，使用 foreman 专用、可吊销的 token，由 internal/secrets 读取后以环境变量传给会话进程，不落盘到会话可读目录；② 不再用 git worktree（其 .git 指向共享仓库，会话可改 core.hooksPath 等配置，foremand 在沙箱外执行 git 时会触发）：每个需求一个会话仓库，由 foremand 自有镜像 ~/.foreman/projects/<p>/repo.git 以 clone --shared 创建，会话只能写它自己的仓库；③ foremand 取回提交只用 git -c core.hooksPath=/dev/null -c core.fsmonitor= fetch <会话仓库> <分支>（GIT_CONFIG_NOSYSTEM=1、GIT_CONFIG_GLOBAL=/dev/null），squash 合回、rebase、push 都在 foremand 自有的集成目录进行，从不以会话仓库为工作目录执行 git"
    amends: [D-009, D-016]
    enforced_by: "test:session-git-config-not-executed；test:sandbox-probe-no-credentials"
    status: active

  - id: D-046
    date: 2026-11-27
    statement: "降低每需求固定成本（ACR-30、ACR-10、ACR-31、ACR-15）：① size=s 的需求由 intake 直接产出单个步骤，跳过 planner；② 单 work 步骤的需求不做 integrate review（state-machine S29）；③ L0 运行与 L1 相同的 lint；L1 失败先分类，runner 被杀或基线本身红时重跑一次而不建 fix 步骤；④ rescuer 的 retry 只多给一轮（grant_one），不清零；⑤ reviewer 只看增量 diff 与未关闭 findings"
    amends: [D-006, D-007]
    enforced_by: "test:state-table-exhaustive；test:l0-covers-l1；test:reviewer-context-delta-only"
    status: active

  - id: D-047
    date: 2026-11-27
