# 配置 vs 代码（D-022）。
# 配置：不进仓库、不走 PR；存 ~/.foreman/config/，通过 `foreman config` 或 web 设置页修改。
#       保存前做 schema 校验（不合法拒绝保存）；每次保存生成 revision（global.db 表 config_revisions：rev, diff, actor, time），
#       `foreman config rollback <rev>` 一条命令回退；新任务开始时生效，运行中的任务继续用自己的快照（C-13）。
#       actor=owner 的修改直接生效；actor=AI（improver/rescuer）只能提交"配置提议"，以按钮发给 owner（H6），不走 PR。
# home 目录：文中的 ~/.foreman 指 FOREMAN_HOME，默认 ~/.foreman，可由环境变量 FOREMAN_HOME 改到任何卷（owner 的部署放在外置盘，与 agent-crew 的 home 同盘）。
#       约束：FOREMAN_HOME 下的 projects/（镜像、会话仓库）与 cache/（GOCACHE、GOMODCACHE 共享层）必须在同一个 APFS 卷——cp -c 与 clone --shared 的硬链接/克隆不能跨卷，跨卷时退化为整份复制（2026-11-27 实测：外置盘 → 系统盘复制 Go 缓存超过 2 分钟）；foremand 启动检查（D-047）比较两者的 st_dev，不同则拒绝启动。
#       项目工作目录也应在同一卷，L0 与会话都在这里构建。
# 代码：在 foreman 仓库，走 PR + 流水线。仓库内只放 config.example.toml。
schema: foreman.config-split/1

config:   # owner 直接改
  - id: CF-01
    item: "项目列表与项目声明：仓库路径、默认分支、服务、日志位置、数据库、PII 掩码、L0 命令"
    file: projects/<p>.toml
  - id: CF-02
    item: "每个角色的模型、effort、token 上限、超时"
    file: roles.toml
  - id: CF-03
    item: "每个角色的 skills 分配"
    file: skills.toml
  - id: CF-04
    item: "并行度：全局 worker 数、单需求并行步骤数"
    file: runtime.toml
  - id: CF-05
    item: "重试次数、review 轮数、PR 切分行数、H4 预算倍数等阈值"
    file: runtime.toml
  - id: CF-06
    item: "资源授予：R1 声明、R2 已批准项（access.yaml 的 tier 定义本身是代码）"
    file: projects/<p>.toml
  - id: CF-07
    item: "线上只读工具开关与限额（prod.sql_ro 启用、行数上限）"
    file: projects/<p>.toml
  - id: CF-12
    item: "每个项目的 L0 预算：时长、GOMAXPROCS、内存（默认 120s / 2 / 2GB，D-049 ④）"
    file: "projects/<p>.toml"
    secret: false
  - id: CF-08
    item: "通知：Telegram chat、免打扰时段（bot token 不在此文件，按 D-026 存于 secrets_dir 的 foreman.telegram.token）"
    file: notify.toml
    secret: false
  - id: CF-09
    item: "改进 stage 的触发频率与每周上限"
    file: runtime.toml
  - id: CF-10
    item: "privguard 项目追加模式"
    file: "项目仓库内 .privguard.toml（属于该项目的代码，随该项目 PR）"
  - id: CF-11
    item: "资源层的限额、阈值、保留量、磁盘上限（design/resources.yaml 中的数值）"
    file: runtime.toml

code:     # foreman 仓库，走 PR
  - id: CD-01
    item: "Go 源码"
  - id: CD-02
    item: "stage 提示词 prompts/<role>.md（行为的一部分，需要和代码一起测试）"
  - id: CD-03
    item: "语言 profile profiles/<lang>/（工具配置模板 + 短规则）"
  - id: CD-04
    item: "foreman 的 constitution.yaml、spec/ 下的设计与决定"
  - id: CD-05
    item: "配置的 schema（Go 类型与校验）；默认值的唯一来源是本文件 keys 表，代码中的默认值由 configgen 生成（D-074），配置文件只写覆盖项"
  - id: CD-06
    item: "资源分级与线上工具的语义定义（access.yaml、prod-access.yaml 的结构部分）"

secrets:  # 见 D-026：services.toml 的 secrets 目录，foreman.<名称>，0600；不进 config_revisions 的 diff（只记录"已修改"）
  - "GitHub token、Telegram bot token、线上只读账号、开发凭据"

# 配置项与默认值的唯一来源（D-074）。代码中的默认值由 internal/config/schema/configgen 从本表生成，
# 不得手写。default 取值：具体值（一律写成字符串）；"owner"＝spec 不给值，owner 未设置时 foremand 拒绝启动；
# "unset"＝可选项，不设置表示该功能不启用或不设上限（含义写在 note）。spec 中找不到出处的值不得写入本表，只能写 "owner"。
keys:
  # runtime.toml
  - { key: secrets_dir,                               file: runtime.toml, type: path,     default: "owner", source: D-026, note: "D-026 的默认值是 owner 本机路径，不进仓库" }
  - { key: parallel.workers,                          file: runtime.toml, type: int,      default: "owner", source: CF-04, note: "spec 未给数值" }
  - { key: parallel.steps_per_requirement,            file: runtime.toml, type: int,      default: "1",     source: D-042, note: "v1 需求内步骤串行；>1 为 phase: v2" }
  - { key: limits.check_fail,                         file: runtime.toml, type: int,      default: "3",     source: D-053 }
  - { key: limits.review_rounds,                      file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.merge_conflict,                     file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.bad_result,                         file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.infra,                              file: runtime.toml, type: int,      default: "6",     source: D-053 }
  - { key: limits.replans,                            file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.planner_failures,                   file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.req_rescues,                        file: runtime.toml, type: int,      default: "2",     source: D-053 }
  - { key: limits.fix_steps,                          file: runtime.toml, type: int,      default: "3",     source: D-053 }
  - { key: limits.pr_split_lines,                     file: runtime.toml, type: int,      default: "800",   source: "D-054, D-042", note: "拆多 PR 为 phase: v2；v1 一个需求一个 PR" }
  - { key: limits.h4_budget_multiplier,               file: runtime.toml, type: float,    default: "2",     source: D-053, note: "H4：单需求成本超过 budget 的 2 倍" }
  - { key: improve.min_interval_hours,                file: runtime.toml, type: int,      default: "owner", source: D-061, phase: v2, note: "improver 为 v2；触发规则与键名在 v2 重定" }
  - { key: improve.weekly_cap,                        file: runtime.toml, type: int,      default: "owner", source: D-061, phase: v2, note: "同上" }
  - { key: resources.github_rest_per_hour,            file: runtime.toml, type: int,      default: "5000",  source: RES-GH-REST }
  - { key: resources.github_graphql_points_per_hour,  file: runtime.toml, type: int,      default: "5000",  source: RES-GH-GRAPHQL }
  - { key: resources.github_write_per_minute,         file: runtime.toml, type: int,      default: "60",    source: RES-GH-WRITE }
  - { key: resources.github_write_per_hour,           file: runtime.toml, type: int,      default: "400",   source: RES-GH-WRITE }
  - { key: resources.github_merge_push_pr_reserve,    file: runtime.toml, type: int,      default: "500",   source: RES-GH-REST }
  - { key: resources.l0_slots,                        file: runtime.toml, type: int,      default: "2",     source: RES-SLOTS }
  - { key: resources.disk_floor_gib,                  file: runtime.toml, type: int,      default: "10",    source: RES-DISK }
  - { key: resources.model_quota_floor_percent,       file: runtime.toml, type: int,      default: "10",    source: RES-MODEL }
  - { key: resources.model_quota_warn_percent,        file: runtime.toml, type: int,      default: "30",    source: RES-MODEL }
  # 沙箱（D-080、D-081、D-082）
  - { key: sandbox.srt_path,                          file: runtime.toml, type: path,        default: "owner", source: D-081, note: "srt 可执行文件；按真实路径使用" }
  - { key: sandbox.node_dir,                          file: runtime.toml, type: path,        default: "owner", source: D-081, note: "srt 是 node 脚本；给真实的 node 所在目录，不能是 mise shim" }
  - { key: sandbox.read_paths,                        file: runtime.toml, type: string_list, default: "owner", source: D-081, note: "会话额外可读的路径（工具链安装目录等）；会话仓库、运行目录、镜像、harness 安装目录由程序自动加入" }
  - { key: sandbox.deny_roots,                        file: runtime.toml, type: string_list, default: "owner", source: D-080, note: "整体禁读的根（owner 主目录、数据卷根）" }
  - { key: session_git.name,                          file: runtime.toml, type: string,      default: "owner", source: D-082 }
  - { key: session_git.email,                         file: runtime.toml, type: string,      default: "owner", source: D-082, note: "须为 noreply 地址（privguard P4）" }
  # roles.toml（role.<name>.<键>；未列出的 角色×键 组合取 unset）
  - { key: role.intake.model,                         file: roles.toml,   type: string,   default: "sonnet", source: "skills.yaml, D-065" }
  - { key: role.planner.model,                        file: roles.toml,   type: string,   default: "opus",   source: skills.yaml }
  - { key: role.coder.model,                          file: roles.toml,   type: string,   default: "sonnet", source: "skills.yaml, D-040" }
  - { key: role.coder.advisor,                        file: roles.toml,   type: bool,     default: "true",   source: "skills.yaml, D-044" }
  - { key: role.coder.advisor_model,                  file: roles.toml,   type: string,   default: "opus",   source: "skills.yaml, D-044" }
  - { key: role.coder.retry_upgrade_model,            file: roles.toml,   type: string,   default: "opus",   source: "skills.yaml, D-053" }
  - { key: role.reviewer.model,                       file: roles.toml,   type: string,   default: "opus",   source: "skills.yaml, D-040" }
  - { key: role.rescuer.model,                        file: roles.toml,   type: string,   default: "opus",   source: "skills.yaml, D-053" }
  - { key: role.rescuer.advisor,                      file: roles.toml,   type: bool,     default: "true",   source: "skills.yaml, D-053" }
  - { key: role.rescuer.advisor_model,                file: roles.toml,   type: string,   default: "opus",   source: "skills.yaml, D-053" }
  - { key: role.diagnoser.model,                      file: roles.toml,   type: string,   default: "opus",   source: skills.yaml, phase: v2 }
  - { key: role.improver.model,                       file: roles.toml,   type: string,   default: "opus",   source: skills.yaml, phase: v2 }
  - { key: role.improver.advisor,                     file: roles.toml,   type: bool,     default: "true",   source: skills.yaml, phase: v2 }
  - { key: role.improver.advisor_model,               file: roles.toml,   type: string,   default: "opus",   source: skills.yaml, phase: v2 }
  - { key: "role.*.timeout",                          file: roles.toml,   type: duration, default: "owner",  source: CF-02, note: "spec 未给数值；C-02 要求有 deadline，所以不能 unset" }
  - { key: "role.*.effort",                           file: roles.toml,   type: string,   default: "unset",  source: CF-02, note: "不设置时由 harness 决定" }
  - { key: "role.*.max_tokens",                       file: roles.toml,   type: int,      default: "unset",  source: "CF-02, PP-5", note: "不设置时只由 max_turns 与 timeout 约束" }
  # projects/<p>.toml
  - { key: repo_path,                                 file: projects/<p>.toml, type: path,   default: "owner", source: CF-01 }
  - { key: github_repo,                               file: projects/<p>.toml, type: string, default: "owner", source: CF-01 }
  - { key: default_branch,                            file: projects/<p>.toml, type: string, default: "owner", source: CF-01 }
  - { key: l0,                                        file: projects/<p>.toml, type: argv_list, default: "owner", source: CF-01 }
  - { key: service,                                   file: projects/<p>.toml, type: table_list, default: "unset", source: CF-01 }
  - { key: database,                                  file: projects/<p>.toml, type: table_list, default: "unset", source: CF-01 }
  - { key: pii_mask,                                  file: projects/<p>.toml, type: string_list, default: "unset", source: CF-01 }
  - { key: l0_budget.timeout,                         file: projects/<p>.toml, type: duration, default: "120s", source: CF-12 }
  - { key: l0_budget.gomaxprocs,                      file: projects/<p>.toml, type: int,      default: "2",    source: CF-12 }
  - { key: l0_budget.memory_mb,                       file: projects/<p>.toml, type: int,      default: "2048", source: CF-12 }
  - { key: access.r1_declared,                        file: projects/<p>.toml, type: string_list, default: "unset", source: CF-06 }
  - { key: access.r2_approved,                        file: projects/<p>.toml, type: string_list, default: "unset", source: CF-06 }
  - { key: prod.sql_ro,                               file: projects/<p>.toml, type: bool,   default: "false", source: "CF-07, D-042", note: "线上访问为 phase: v2" }
  - { key: prod.rows_max,                             file: projects/<p>.toml, type: int,    default: "500",   source: prod-access.yaml }
