# spec 本身的格式规则（D-015、D-025、D-062）。由 foreman spec lint 检查（实现前为 tools/ 下脚本）。
# 本文件定义 F1–F10；E-ACC 的 EARS 规则即 F2。
schema: foreman.format-rules/1

rules:
  - id: F1
    rule: "每个可引用的条目有稳定 id（D-n、C-n、Q-n、Sn、Hn、RES-*、OP-n 等）；id 一经发布不复用"
    check: "lint：同一文件内 id 唯一；全仓引用的 id 都能解析（C-12）"
  - id: F2
    rule: "验收条目用 EARS 句式，五种之一：Ubiquitous『系统应当…』；Event『当 <触发> 时，系统应当…』；State『在 <状态> 期间，系统应当…』；Unwanted『如果 <异常>，那么系统应当…』；Optional『在具备 <特性> 的情况下，系统应当…』"
    check: "lint：internal/spec/ears 的正则集合；不匹配即拒绝入库"
  - id: F3
    rule: "每条规则或决定写明 verify 或 enforced_by；enforced_by 取值 test:<名> | check:<名> | sandbox + test:<名> | none"
    check: "lint"
  - id: F4
    rule: "enforced_by 不允许只写 program:<模块>：模块名不是检查，必须附至少一个 test: 或 check:，否则按 none 计（ACR-34）；constitution 中 none 最多 3 条"
    check: "lint"
  - id: F5
    rule: "禁用模糊词：适当、合理、尽量、必要时、等等、相关的、大约（数值请写具体值或范围）"
    check: "lint：词表匹配，引号内的原话引用除外"
  - id: F6
    rule: "未决问题只能写在 open-questions.yaml；其它文件引用未决问题时必须标 pending: Q-n"
    check: "lint"
  - id: F7
    rule: "decisions.yaml 只追加；链接字段只有 supersedes、amends、resolves，写在新条目上"
    check: "lint + git diff：已有条目除 status 外不得修改"
  - id: F8
    rule: "对有效（未被取代）条目：每条最多被一个有效条目 amends，且 amends 的目标本身不得是 amends 条目；需要再次修改时用 supersedes 重写全文（ACR-33）。指向已取代条目的 amends 是历史记录，不计"
    check: "lint"
  - id: F9
    rule: "提示词与规则文本有体积上限：每个 prompts/<role>.md ≤ 6000 字节，profile 短规则 ≤ 1.5k token，AGENTS.md ≤ 6000 字节，全部合计 ≤ 40000 字节；长清单（禁令、路径表）只能放数据文件并生成，生成物标 generated, do not edit（ACR-33）"
    check: "check:prompts-size"
  - id: F10
    rule: "条目可带 phase: v2，表示设计保留但 v1 不实现（D-042）；v1 的测试清单不包含 phase: v2 条目的 test"
    check: "check:spec-phase-tags"

render:
  - "foreman decisions --current：按 supersedes/amends 合成当前有效文本，读者不必合读（ACR-33）"
