# Example runtime.toml. Copy to $FOREMAN_HOME/config/runtime.toml.
# Defaults come from the keys table of spec/design/config.yaml (D-074); this
# file lists the keys that have no default (secrets_dir, parallel.workers) and
# a few overrides. Secrets never go in this file; only the directory that holds
# them (D-026).

secrets_dir = "/srv/example/secrets"   # files foreman.<name>, mode 0600; directory 0700

[parallel]                  # CF-04
workers = 2                 # no default: the owner chooses

[limits]                    # CF-05 (override example; the default is 3)
check_fail = 4

[resources]                 # CF-11 (override example; the default is 2)
l0_slots = 3
