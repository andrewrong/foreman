# Example runtime.toml. Copy to $FOREMAN_HOME/config/runtime.toml.
# Defaults come from the keys table of spec/design/config.yaml (D-074); this
# file lists the keys that have no default (secrets_dir, parallel.workers) and
# a few overrides. Secrets never go in this file; only the directory that holds
# them (D-026). Every key without a default must be set: foremand refuses to
# start and names each missing one (D-074). The claude CLI is not configured:
# foremand finds it on its own PATH at every session launch (D-084).

secrets_dir = "/srv/example/secrets"   # files foreman.<name>, mode 0600; directory 0700

[parallel]                  # CF-04
workers = 2                 # no default: the owner chooses

[sandbox]                   # D-080, D-081: no defaults, the owner supplies every path
srt_path = "/srv/example/tools/srt/node_modules/.bin/srt"
node_dir = "/srv/example/tools/node/bin"            # real node directory, not a mise shim
read_paths = ["/srv/example/toolchains/go"]         # extra readable paths (toolchains)
deny_roots = ["/srv/example/ownerhome", "/srv/example/data"]   # owner home and data volume roots

[session_git]               # D-082: identity of the generated session .gitconfig
name = "foreman"
email = "foreman@users.noreply.example.com"

[limits]                    # CF-05 (override example; the default is 3)
check_fail = 4

[resources]                 # CF-11 (override example; the default is 2)
l0_slots = 3
