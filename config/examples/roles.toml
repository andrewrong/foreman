# Example roles.toml (CF-02). Models and advisor settings have defaults
# (spec/design/config.yaml keys table); timeout has none, so every role sets it.

[role.intake]
timeout = "20m"

[role.planner]
timeout = "40m"

[role.coder]
effort = "medium"          # low | medium | high | xhigh | max, or omit
timeout = "45m"

[role.reviewer]
model = "opus"
timeout = "30m"

[role.rescuer]
timeout = "40m"

[role.diagnoser]
timeout = "30m"

[role.improver]
timeout = "30m"
